[pytest]
# Suite 'integration' butuh GPU/model/API dan di-skip otomatis bila
# lingkungannya tidak tersedia (lihat conftest.py). CI hanya menjalankan
# 'unit or contract'.
addopts = -ra -m "unit or contract"
testpaths = tests
markers =
    unit: tes cepat tanpa GPU/API (default CI)
    contract: validasi schema keluaran kalkulator
    integration: butuh retriever bge-m3 / LLM / vector DB (manual / GPU runner)
